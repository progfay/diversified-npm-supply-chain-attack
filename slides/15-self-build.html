<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>もしくは、自作する?</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>もしくは、自作する?</h1>
  <ul>
    <li>小さな処理なら、依存(= 信頼する相手)を1つ減らせる</li>
    <li>自分のコードとして、レビューやスキャンの対象にできる</li>
    <li>ただし、自作したコードが新たな脆弱性を生むこともある</li>
  </ul>
  <aside class="notes">
    もしくは、自作するという手もあります。小さな処理なら、依存を、つまり信頼する相手を1つ減らせますし、自分のコードとしてレビューやスキャンの対象にできます。ただ、自作したコードが新たな脆弱性を生むこともあるので、何でも自作すればいいわけではありません。
  </aside>
</body>
</html>
