<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>だから信頼する数を減らそう</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      text-align: center;
    }
    .slide p {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.5;
      margin: 0;
    }
    .slide strong {
      color: var(--color-accent);
    }
  </style>
</head>
<body class="slide">
  <p>だから<strong>信頼する数</strong>を減らそう</p>
  <aside class="notes">
    だから、信頼する相手の数を減らします。どうしても必要なものだけに絞って、似た役割のパッケージは1つにまとめたり、メンテナンスが活発で、関わる人の多いものに乗り換えたりする。私も、なんとなく減らすのではなく、信頼できるものに寄せていくことを意識しています。そして、残る依存も、信頼しきらずに疑いながら使います。
  </aside>
</body>
</html>
