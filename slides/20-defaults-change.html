<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>新しい手口を勉強し続ける</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>新しい手口を勉強し続ける</h1>
  <ul>
    <li>手口は増え続ける: インストール時だけでなく、import 時(node-ipc)やフォルダを開いた時(keyv)にも動く</li>
    <li>対策の不備も見つかる: pnpm の Minimum Release Age は、lockfile を約4か月検査していなかった</li>
    <li>既定値も変わる: npm v12 で install スクリプトが既定でオフに</li>
  </ul>
  <aside class="notes"></aside>
</body>
</html>
