<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Minimum Release Age は「誰かが気づく」前提</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>Minimum Release Age は「誰かが気づく」前提</h1>
  <ul>
    <li>悪意あるバージョンは、公開から数時間で見つかって消されることが多い</li>
    <li>その数時間を待ってからインストールする仕組み</li>
    <li>誰も見ていないパッケージなら、何日待っても気づかれない</li>
  </ul>
  <aside class="notes"></aside>
</body>
</html>
