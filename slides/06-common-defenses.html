<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>よく聞く対策</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .rows { display: grid; grid-template-columns: auto 1fr; row-gap: 24px; }
    .card {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      column-gap: 48px;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 32px 36px 32px 44px;
      border-radius: 12px;
      background: var(--color-surface);
    }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-accent); }
    .card h2 { font-family: var(--font-display); font-size: var(--text-h2); margin: 0; white-space: nowrap; }
    .card .desc { color: var(--color-muted); }
  </style>
</head>
<body class="slide">
  <h1>よく聞く対策</h1>
  <div class="rows">
    <section class="card">
      <h2><code>--ignore-scripts</code></h2>
      <p class="desc">install 時に動く script を止める</p>
    </section>
    <section class="card">
      <h2>Minimum Release Age</h2>
      <p class="desc">公開されたばかりのバージョンを入れない</p>
    </section>
  </div>
  <aside class="notes">サプライチェーン攻撃に対して、最近よく聞く対策が2つあります。1つは script を無視すること。インストールのときに自動で動くスクリプトを止めます。もう1つは Minimum Release Age。公開されたばかりのバージョンを一定期間入れないようにします。</aside>
</body>
</html>
