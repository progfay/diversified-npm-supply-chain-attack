<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>よく聞く対策</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .card {
      padding: 32px;
      border-radius: 12px;
      background: var(--color-surface);
      border-top: 4px solid var(--color-accent);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      margin: 0;
    }
    .card p { color: var(--color-muted); }
  </style>
</head>
<body class="slide">
  <h1>よく聞く対策</h1>
  <div class="cards">
    <section class="card">
      <h2>postinstall のブロック</h2>
      <p>インストール時に動くスクリプトを止める</p>
    </section>
    <section class="card">
      <h2>Minimum Release Age</h2>
      <p>公開されたばかりのバージョンを入れない</p>
    </section>
  </div>
  <aside class="notes">
    これに対して、最近よく聞く対策が2つあります。1つは postinstall のブロック。インストールのときに自動で動くスクリプトを止めます。もう1つは Minimum Release Age。公開されたばかりのバージョンは、しばらく入れないようにします。pnpm では今これがデフォルトで入っていたりもします。ほかにもバージョンの固定やスキャンなどがありますが、今日はこの2つを取り上げます。
  </aside>
</body>
</html>
