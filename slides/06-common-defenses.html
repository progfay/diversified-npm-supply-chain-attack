<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>よく聞く対策</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>よく聞く対策</h1>
  <ul>
    <li>postinstall のブロック: インストール時に動くスクリプトを止める</li>
    <li>Minimum Release Age: 公開されたばかりのバージョンを入れない</li>
  </ul>
  <aside class="notes">
    これに対して、最近よく聞く対策が2つあります。1つは postinstall のブロック。インストールのときに自動で動くスクリプトを止めます。もう1つは Minimum Release Age。公開されたばかりのバージョンは、しばらく入れないようにします。pnpm では今これがデフォルトで入っていたりもします。ほかにもバージョンの固定やスキャンなどがありますが、今日はこの2つを取り上げます。
  </aside>
</body>
</html>
