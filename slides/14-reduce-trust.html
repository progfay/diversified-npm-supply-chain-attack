<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>だから、信頼する数を減らす</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>だから、信頼する数を減らす</h1>
  <ul>
    <li>依存を減らす・まとめる</li>
    <li>残る依存も、疑いながら使う</li>
  </ul>
  <aside class="notes">
    だから、信頼する相手の数を減らします。依存を減らしたり、似た役割のパッケージを1つにまとめたり、メンテナンスが活発で、関わる人の多いものに乗り換えたりする。私も、なんとなく減らすのではなく、信頼できるものに寄せていくことを意識しています。そして、残る依存も、信頼しきらずに疑いながら使います。
  </aside>
</body>
</html>
