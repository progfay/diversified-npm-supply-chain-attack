<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Supply Chain Attack</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .tree { width: auto; height: 380px; flex-shrink: 0; display: block; margin: 0 auto; }
    .tree line { stroke: var(--color-line); stroke-width: 2; }
    .tree rect { fill: var(--color-surface); stroke: var(--color-line); stroke-width: 2; }
    .tree text { fill: var(--color-ink); font-family: var(--font-mono); font-size: 22px; text-anchor: middle; dominant-baseline: central; }
    .tree .region { fill: none; stroke: var(--color-muted); stroke-dasharray: 8 6; }
    .tree .region-label { fill: var(--color-muted); text-anchor: start; }
    .tree .self rect { stroke: var(--color-accent); }
    .tree .self text { fill: var(--color-accent); }
    .tree .direct rect { stroke: var(--color-accent); }
    .tree .indirect rect { stroke-dasharray: 6 4; }
    .tree .bad rect { stroke: var(--color-danger); }
    .tree line.hot { stroke: var(--color-danger); stroke-width: 3; }
    .tree .skull { font-family: var(--font-body); font-size: 26px; }
    .tree .legend { font-family: var(--font-body); font-size: 20px; text-anchor: end; }
    .tree .legend.direct { fill: var(--color-accent); }
    .tree .legend.indirect { fill: var(--color-muted); }
    .slide .lead { margin-top: auto; text-align: center; font-size: var(--text-h2); font-weight: 700; }
    .lead .num { font-weight: 500; }
  </style>
</head>
<body class="slide">
  <h1>Supply Chain Attack</h1>
    <svg class="tree" viewBox="0 0 1120 370" role="img" aria-label="依存木">
      <rect class="region" x="100" y="100" width="920" height="262" rx="16"/>
      <text class="region-label" x="116" y="86">node_modules</text>
      <line x1="560" y1="62" x2="330" y2="114"/>
      <line class="hot" x1="560" y1="62" x2="790" y2="114"/>
      <line x1="330" y1="158" x2="200" y2="210"/>
      <line x1="330" y1="158" x2="460" y2="210"/>
      <line class="hot" x1="790" y1="158" x2="790" y2="210"/>
      <line x1="200" y1="254" x2="200" y2="306"/>
      <line class="hot" x1="790" y1="254" x2="660" y2="306"/>
      <line x1="790" y1="254" x2="920" y2="306"/>
      <g class="self"><rect x="480" y="18" width="160" height="44" rx="8"/><text x="560" y="40">my-app</text></g>
      <g class=""><rect x="250" y="114" width="160" height="44" rx="8"/></g>
      <g class="bad"><rect x="710" y="114" width="160" height="44" rx="8"/></g>
      <g class=""><rect x="120" y="210" width="160" height="44" rx="8"/></g>
      <g class=""><rect x="380" y="210" width="160" height="44" rx="8"/></g>
      <g class="bad"><rect x="710" y="210" width="160" height="44" rx="8"/></g>
      <g class=""><rect x="120" y="306" width="160" height="44" rx="8"/></g>
      <g class="bad"><rect x="580" y="306" width="160" height="44" rx="8"/><text class="skull" x="660" y="328">☠️</text></g>
      <g class=""><rect x="840" y="306" width="160" height="44" rx="8"/></g>
    </svg>
  <p class="lead">攻撃者は<strong>どれか<span class="num">1</span>つを乗っ取るだけでいい</strong></p>
  <aside class="notes">
    ここで、この木のどこか、たとえば末端のパッケージが1つ乗っ取られたとします。悪意あるバージョンが公開されると、依存をたどって、そのまま自分の環境に入ってきて、自分のプロジェクトの中で動いてしまいます。攻撃者は、この木のどれか1つを乗っ取るだけでいいんです。これがサプライチェーン攻撃です。
  </aside>
</body>
</html>
