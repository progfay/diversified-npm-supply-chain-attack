<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>コードが届く範囲を狭める</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>コードが届く範囲を狭める</h1>
  <ul>
    <li>悪意あるコードはユーザー権限で動き、Downloads や Desktop のファイルも読める</li>
    <li>開発環境を分ける(コンテナなど)と、届く範囲を狭められる</li>
    <li>ただし運用頼みで、完璧ではない</li>
  </ul>
  <aside class="notes"></aside>
</body>
</html>
