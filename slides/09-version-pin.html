<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>バージョン固定も、更新の時は守れない</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>バージョン固定も、更新の時は守れない</h1>
  <ul>
    <li>固定すれば、更新作業以外のインストールでは被害を抑えられる</li>
    <li>でも、セキュリティアップデートに素早く対応するには、こまめな更新が必要</li>
    <li>更新の時に悪いバージョンを掴めば、そのまま固定される</li>
  </ul>
  <aside class="notes"></aside>
</body>
</html>
