<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>パッケージのインストールとサプライチェーン攻撃</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .tree { width: auto; height: 270px; display: block; margin: 0 auto; }
    .tree line { stroke: var(--color-line); stroke-width: 2; }
    .tree rect { fill: var(--color-surface); stroke: var(--color-line); stroke-width: 2; }
    .tree text { fill: var(--color-ink); font-family: var(--font-mono); font-size: 20px; text-anchor: middle; dominant-baseline: central; }
    .tree .self rect { stroke: var(--color-accent); }
    .tree .self text { fill: var(--color-accent); }
    .tree .direct rect { stroke: var(--color-accent); }
    .tree .indirect rect { stroke-dasharray: 6 4; }
    .tree .indirect text { fill: var(--color-muted); }
    .tree .bad rect { stroke: var(--color-danger); fill: var(--color-surface); }
    .tree .bad text { fill: var(--color-danger); }
    .tree .tag { font-family: var(--font-body); font-size: 18px; }
    .tree .tag.accent { fill: var(--color-accent); }
    .tree .tag.danger { fill: var(--color-danger); }
    .tree .tag.muted { fill: var(--color-muted); }
    .caption { display: flex; flex-direction: column; gap: 4px; }
    .figure { display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body class="slide">
  <h1>パッケージのインストールとサプライチェーン攻撃</h1>
  <div class="figure">
    <svg class="tree" viewBox="0 0 1120 370" role="img" aria-label="サンプルの依存木">
      <line x1="560" y1="50" x2="330" y2="102"/>
      <line x1="560" y1="50" x2="790" y2="102"/>
      <line x1="330" y1="146" x2="200" y2="198"/>
      <line x1="330" y1="146" x2="460" y2="198"/>
      <line x1="790" y1="146" x2="790" y2="198"/>
      <line x1="200" y1="242" x2="200" y2="294"/>
      <line x1="790" y1="242" x2="660" y2="294"/>
      <line x1="790" y1="242" x2="920" y2="294"/>
      <g class="self"><rect x="480" y="6" width="160" height="44" rx="8"/><text x="560" y="28">my-app</text></g>
      <g class=""><rect x="250" y="102" width="160" height="44" rx="8"/><text x="330" y="124">pkg-a</text></g>
      <g class=""><rect x="710" y="102" width="160" height="44" rx="8"/><text x="790" y="124">pkg-b</text></g>
      <g class=""><rect x="120" y="198" width="160" height="44" rx="8"/><text x="200" y="220">pkg-c</text></g>
      <g class=""><rect x="380" y="198" width="160" height="44" rx="8"/><text x="460" y="220">pkg-d</text></g>
      <g class=""><rect x="710" y="198" width="160" height="44" rx="8"/><text x="790" y="220">pkg-e</text></g>
      <g class="bad"><rect x="120" y="294" width="160" height="44" rx="8"/><text x="200" y="316">pkg-f</text></g>
      <g class=""><rect x="580" y="294" width="160" height="44" rx="8"/><text x="660" y="316">pkg-g</text></g>
      <g class=""><rect x="840" y="294" width="160" height="44" rx="8"/><text x="920" y="316">pkg-h</text></g>
      <text class="tag accent" x="760" y="28">← 自分で書いたコードはここだけ</text>
      <text class="tag danger" x="200" y="348">乗っ取られた</text>
    </svg>
  </div>
  <div class="caption">
    <p>プロジェクトのコードの大半は、自分で書いていない</p>
    <p>そのどれかが乗っ取られると、<strong>悪意あるコードが自分の環境で動く</strong></p>
  </div>
  <aside class="notes">
    皆さん、npm install や pnpm install は、毎日のようにしていると思います。インストールしたパッケージは node_modules に入りますが、プロジェクトのコードの大半は、実はこの中にあって、自分では書いていません。その依存のどれかが乗っ取られると、悪意あるコードが、そのまま自分の環境で動いてしまいます。これがサプライチェーン攻撃です。
  </aside>
</body>
</html>
