<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>被害が小さくなるようにする</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .rows {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .row {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
      align-items: center;
      padding: 20px 28px;
      border-radius: 12px;
      background: var(--color-surface);
    }
    .row b { color: var(--color-accent); font-size: var(--text-h2); }
    .row span { color: var(--color-muted); font-size: var(--text-muted); }
  </style>
</head>
<body class="slide">
  <h1>被害が小さくなるようにする</h1>
  <div class="rows">
    <div class="row"><b>渡す権限を絞る</b><span>必要以上の権限やクレデンシャルを、実行環境に渡さない</span></div>
    <div class="row"><b>触れる範囲を狭める</b><span>悪意あるコードが読めるものを減らす</span></div>
    <div class="row"><b>無効化の準備をする</b><span>鍵をローテートできるようにしておく</span></div>
  </div>
  <aside class="notes">
    受けにくくしても、入られる可能性はゼロにはなりません。だから、入られたときの被害を小さくします。必要以上の権限やクレデンシャルを、実行環境に渡さない。悪意あるコードが読めるものを減らす。そして、盗まれてもすぐ無効にできるように、鍵をローテートできる状態にしておく。私が普段気をつけているのは、このあたりです。
  </aside>
</body>
</html>
