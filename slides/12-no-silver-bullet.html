<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>銀の弾丸はない</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      text-align: center;
    }
    .slide p {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.5;
      margin: 0;
    }
    .slide strong {
      color: var(--color-accent);
    }
  </style>
</head>
<body class="slide">
  <p><strong>銀の弾丸</strong>はない</p>
  <aside class="notes">どちらの対策も、それぞれ守れる範囲が限られています。
しかし攻撃は日々進化・多様化していて、いつかこれらの対策だけでは守りきれない攻撃がくるかもしれません。
サプライチェーン攻撃から守ってくれる銀の弾丸はありません。</aside>
</body>
</html>
