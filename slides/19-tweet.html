<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>引用: Yosuke Furukawa</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .slide { justify-content: center; align-items: center; }
    .tweet {
      width: 860px;
      padding: 36px 40px;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .who { display: flex; align-items: center; gap: 16px; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--color-line);
      color: var(--color-ink);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: var(--text-body);
    }
    .name { font-weight: 700; }
    .handle { color: var(--color-muted); font-size: var(--text-muted); }
    .text { font-size: var(--text-h2); line-height: 1.6; }
    .meta { color: var(--color-muted); font-size: var(--text-muted); }
    .meta a { color: var(--color-muted); }
  </style>
</head>
<body class="slide">
  <blockquote class="tweet" cite="https://x.com/yosuke_furukawa/status/2118167546516144135">
    <div class="who">
      <span class="avatar">Y</span>
      <div><div class="name">Yosuke Furukawa</div><div class="handle">@yosuke_furukawa</div></div>
    </div>
    <p class="text">なんでも自分の所で作れば脆弱性報告なんて無いっていう人が出てきちゃうからすごいよなぁ。そりゃ CVE には登録されないだろうけど、脆弱性はあるだろとは思うんだが。バグが亡くならないと同じで。</p>
    <p class="meta"><a href="https://x.com/yosuke_furukawa/status/2118167546516144135">X · 2026年11月5日</a></p>
  </blockquote>
  <aside class="notes">
    実際、こんな投稿もありました。何でも自分のところで作れば、脆弱性報告は来ないかもしれない。CVE にも登録されない。でも、脆弱性がなくなるわけではありません。バグがなくならないのと同じです。だから、自作するなら、自分が理解できる範囲で、です。
  </aside>
</body>
</html>
