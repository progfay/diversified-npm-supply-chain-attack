<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>攻撃は置き換わらず、増えていく</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .cols h2 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      font-weight: 700;
      margin: 0 0 24px;
    }
    .cols .ok h2 { color: var(--color-success); }
    .cols .ng h2 { color: var(--color-danger); }
  </style>
</head>
<body class="slide">
  <h1>攻撃は置き換わらず、増えていく</h1>
  <div class="cols">
    <section class="ok">
      <h2>✅ postinstall のブロックで止まる</h2>
      <ul>
        <li>PhantomRaven</li>
        <li>keyv</li>
      </ul>
    </section>
    <section class="ng">
      <h2>❌ 止まらない</h2>
      <ul>
        <li>node-ipc</li>
        <li>AsyncAPI</li>
      </ul>
    </section>
  </div>
  <aside class="notes"></aside>
</body>
</html>
