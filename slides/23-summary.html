<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>まとめ</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
  </style>
</head>
<body class="slide">
  <h1>まとめ</h1>
  <ul>
    <li>銀の弾丸はない</li>
    <li>だから、多角的に備える</li>
    <li>攻撃の変化に合わせて、調整し続ける</li>
  </ul>
  <aside class="notes"></aside>
</body>
</html>
