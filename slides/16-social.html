<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Social Engineering</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .scene {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      text-align: center;
      margin-top: auto;
    }
    .actor { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .actor .icon { font-size: 80px; line-height: 1; }
    .actor .name { font-size: var(--text-muted); color: var(--color-muted); }
    .link { display: flex; flex-direction: column; align-items: center; color: var(--color-accent); font-size: var(--text-muted); }
    .link .arrow { font-size: var(--text-h2); line-height: 1; }
    .slide .lead { margin-top: auto; text-align: center; font-size: var(--text-h2); font-weight: 700; }
    .attacker { position: absolute; top: 436px; right: 105px; width: 260px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--color-danger); }
    .attacker .icon { font-size: 72px; line-height: 1; }
    .attacker .arrow { position: relative; font-size: var(--text-h2); font-weight: 700; line-height: 1.2; }
    .attacker .arrow .tag { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 12px; white-space: nowrap; font-size: var(--text-muted); }
    .attacker .name { font-size: var(--text-muted); }
  </style>
</head>
<body class="slide">
  <h1>Social Engineering</h1>
  <div class="scene">
    <div class="actor"><span class="icon">🧑‍💻</span><span class="name">You</span></div>
    <div class="link"><span>install</span><span class="arrow">←</span></div>
    <div class="actor"><span class="icon">📦</span><span class="name">npm package</span></div>
    <div class="link"><span>publish</span><span class="arrow">←</span></div>
    <div class="actor"><span class="icon">🧑‍🔧</span><span class="name">Maintainer</span></div>
  </div>
  <div class="attacker"><span class="arrow">↑<span class="tag">takeover</span></span><span class="icon">😈</span><span class="name">Attacker</span></div>
  <p class="lead">人間が<strong>セキュリティホール</strong></p>
  <aside class="notes">
    ここで攻撃者が狙うのは、パッケージのコードそのものより、それを公開しているメンテナです。メンテナをだましたり、アカウントを乗っ取ったりできれば、正規の手順で悪意あるバージョンを公開できます。人とアカウントが狙われるんです。
  </aside>
</body>
</html>
