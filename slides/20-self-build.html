<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>もしくは自作...？</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .cols {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .col {
      padding: 28px 32px;
      border-radius: 12px;
      background: var(--color-surface);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .col h2 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      margin: 0;
    }
    .good h2 { color: var(--color-success); }
    .bad h2 { color: var(--color-warning); }
    .slide .bottom { margin-top: auto; text-align: center; font-size: var(--text-h2); font-weight: 700; }
  </style>
</head>
<body class="slide">
  <h1>もしくは自作...？</h1>
  <div class="cols">
    <section class="col good">
      <h2>👍 嬉しいこと</h2>
      <ul>
        <li>外部への依存を減らせる</li>
        <li>自分のコードとしてレビューやスキャンの対象にできる</li>
      </ul>
    </section>
    <section class="col bad">
      <h2>⚠️ 注意</h2>
      <p>自作したコードが新たな脆弱性を生むこともある</p>
    </section>
  </div>
  <p class="bottom"><strong>自分が理解できる範囲で</strong>自作しよう</p>
  <aside class="notes">自作すると外部への依存が減らせたり、自分のコードとして AI Review や Scan の対象にできるようになります。
一方で、自作したコードが新たな脆弱性を生み出してしまう可能性もあります。
自分で面倒が見れる、理解できる範囲での自作を心がけるべきだと私は考えています。</aside>
</body>
</html>
