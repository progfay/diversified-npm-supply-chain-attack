<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>postinstall を止めてもコードは入る</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .flow {
      margin: auto;
      display: grid;
      grid-template-columns: auto 172px auto;
      grid-template-rows: 216px auto;
      column-gap: 16px;
      row-gap: 48px;
      align-items: center;
    }
    .branch { width: 172px; height: 216px; display: block; }
    .branch line { stroke: var(--color-muted); stroke-width: 3; }
    .branch polygon { fill: var(--color-muted); }
    .cmd {
      font-family: var(--font-mono);
      font-size: var(--text-h2);
      height: 56px;
      line-height: 48px;
      padding: 0 20px;
      border-radius: 8px;
      background: var(--color-surface);
      border: 2px solid var(--color-line);
      white-space: nowrap;
      justify-self: start;
    }
    .cmds { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
    .cmds .cmd { border-color: var(--color-danger); }
    .note { display: flex; flex-direction: column; gap: 8px; align-self: start; }
    .what { color: var(--color-muted); font-size: var(--text-muted); white-space: nowrap; }
    .result { font-size: var(--text-h2); font-weight: 700; }
    .ok { color: var(--color-success); }
    .ng { color: var(--color-danger); }
  </style>
</head>
<body class="slide">
  <h1>postinstall を止めてもコードは入る</h1>
  <div class="flow">
    <span class="cmd">npm install</span>
    <svg class="branch" viewBox="0 0 172 216" aria-hidden="true"><line x1="6" y1="108" x2="157.4" y2="32.3"/><polygon points="166,28 155.3,42.3 148.1,28.0"/><line x1="6" y1="108" x2="156.4" y2="108.0"/><polygon points="166,108 150.0,116.0 150.0,100.0"/><line x1="6" y1="108" x2="157.4" y2="183.7"/><polygon points="166,188 148.1,188.0 155.3,173.7"/></svg>
    <div class="cmds">
      <span class="cmd">npm start</span>
      <span class="cmd">npm test</span>
      <span class="cmd">npm run lint</span>
    </div>
    <div class="note"><p class="what">preinstall / postinstall</p><p class="result ok">✅ ブロックできる</p></div>
    <span></span>
    <div class="note"><p class="what"><code>import "compromised-pkg"</code></p><p class="result ng">❌ 止められない</p></div>
  </div>
  <aside class="notes">
    ignore-scripts で postinstall を無視しても、悪意のあるコードは環境にインストールされます。そのため、 postinstall が実行されずとも、 npm start や npm test などでコード自体を実行すれば malware が起動してしまいます。
  </aside>
</body>
</html>
