<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>備えよう: 被害が小さくなるようにする</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide .recap {
      position: absolute;
      top: 32px;
      right: 40px;
      font-size: var(--text-muted);
      color: var(--color-muted);
      border: 1px solid var(--color-line);
      border-radius: 6px;
      padding: 2px 12px;
    }
    .slide li.dim {
      color: var(--color-muted);
    }
    .slide li.current {
      color: var(--color-accent);
      font-weight: 700;
    }
  </style>
</head>
<body class="slide">
  <span class="recap">再掲</span>
  <h1>備えよう</h1>
  <ul>
    <li class="dim">被害を受けにくくする</li>
    <li class="current">被害が小さくなるようにする</li>
    <li class="dim">新しい手口を勉強し続ける</li>
  </ul>
  <aside class="notes">
    2つめは、被害が小さくなるようにする、です。
  </aside>
</body>
</html>
