<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>未知の攻撃に備えよう！</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      text-align: center;
    }
    .slide p {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.5;
      margin: 0;
    }
    .slide strong {
      color: var(--color-accent);
    }
  </style>
</head>
<body class="slide">
  <p>未知の攻撃に<strong>備えよう</strong>！</p>
  <aside class="notes">
    どの備えも、それだけでは完璧ではありません。だから重ねます。
  </aside>
</body>
</html>
