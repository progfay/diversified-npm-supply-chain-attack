<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>タイトル</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-title);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide .sub {
      font-size: var(--text-h2);
      color: var(--color-accent);
      margin: 0;
    }
    .slide .meta {
      font-size: var(--text-body);
      color: var(--color-muted);
      margin: 0;
    }
    .slide a { color: inherit; text-decoration: none; }
  </style>
</head>
<body class="slide">
  <h1><a href="https://jsconf.jp/2026/ja/talks/progfay">多様化する<br>npm サプライチェーン攻撃</a></h1>
  <p class="sub">多角的な備えという向き合い方</p>
  <p class="meta">2026-11-22 / <a href="https://jsconf.jp/2026/">JSConf JP 2026</a> / <a href="https://github.com/progfay">@progfay</a></p>
  <aside class="notes">「多様化する npm サプライチェーン攻撃: 多角的な備えという向き合い方」というタイトルで話します。</aside>
</body>
</html>
