<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>引用: Yosuke Furukawa</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .slide { justify-content: center; align-items: center; }
    .tweet {
      width: 550px;
      height: 300px;
      border: 0;
      transform: scale(1.7);
    }
  </style>
</head>
<body class="slide">
  <iframe class="tweet" src="https://platform.twitter.com/embed/Tweet.html?id=2118167546516144135&amp;theme=dark&amp;lang=ja&amp;dnt=true" title="Yosuke Furukawa の X の投稿" loading="lazy"></iframe>
  <aside class="notes">
    JSConf JP organizer の古川さんもこのように投稿していました。
    脆弱性が報告・修正されるということはどんどん堅牢になっていくということで、自作するよりも安全である場合もあるので、そこは見極めが重要です。
  </aside>
</body>
</html>
