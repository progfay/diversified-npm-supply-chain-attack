<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>備えよう</title>
  <link rel="stylesheet" href="../design-system/system.css">
  <style>
    .slide {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: var(--space-page);
      background: var(--color-bg);
      color: var(--color-ink);
      font-family: var(--font-body);
      font-size: var(--text-body);
      line-height: 1.7;
    }
    .slide h1 {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      line-height: 1.3;
      margin: 0;
    }
    .slide p { margin: 0; text-wrap: pretty; }
    .slide code { font-family: var(--font-mono); }
    .slide strong { color: var(--color-accent); }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 20px 32px;
      border-radius: 12px;
      background: var(--color-surface);
    }
    .card .num {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1;
    }
    .card p { font-size: var(--text-h2); font-weight: 700; }
  </style>
</head>
<body class="slide">
  <h1>備えよう</h1>
  <div class="cards">
    <section class="card"><span class="num">1</span><p>被害を受けにくくする</p></section>
    <section class="card"><span class="num">2</span><p>被害が小さくなるようにする</p></section>
    <section class="card"><span class="num">3</span><p>新しい手口を勉強し続ける</p></section>
  </div>
  <aside class="notes">
    じゃあ、どうするか。私は3つの方向で備えようと考えています。被害を受けにくくすること、被害が小さくなるようにすること、そして新しい手口を勉強し続けることです。順に話します。
  </aside>
</body>
</html>
